<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#0f5a45">
<title>Kehadiran Mesyuarat - SMK Meradong</title>
<style>
  :root{
    --accent:#1f7a5f;
    --accent-dark:#10513c;
    --accent-mid:#2a9070;
    --ink:#12211c;
    --muted:#6b7c74;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; padding:0; height:100%; background:#fff; color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; }
  iframe { display:block; border:0; width:100%; height:100%; }

  /* ---------------- loading splash ---------------- */
  /* Centred with margin:auto rather than align-items:center - a flex container
     centred that way CLIPS the top of an over-tall child (a phone in landscape),
     and the card is the one thing that must never be cut off. */
  #boot {
    position:fixed; inset:0; z-index:10; display:flex; overflow:auto; padding:18px;
    background:linear-gradient(180deg,#e3efe8 0%,#eef4f0 40%,#f8fbf9 100%);
    transition:opacity .3s ease;
  }
  #boot.done { opacity:0; pointer-events:none; }
  .splash {
    width:100%; max-width:400px; margin:auto; padding:28px 24px 22px; text-align:center;
    background:#fff; border-radius:20px; box-shadow:0 16px 44px rgba(10,44,34,.16);
  }
  .logo { height:64px; width:auto; display:block; margin:0 auto 12px; }
  .brand { font-size:15px; font-weight:800; letter-spacing:.1em; color:var(--accent-dark); }
  .brand small { display:block; margin-top:3px; font-size:12.5px; font-weight:600;
    letter-spacing:.04em; color:var(--muted); }
  .meter { height:4px; border-radius:999px; background:#e7eeea; overflow:hidden; margin:20px 0 12px; }
  .meter i { display:block; width:38%; height:100%; border-radius:999px;
    background:linear-gradient(90deg,var(--accent),var(--accent-mid));
    animation:slide 1.15s ease-in-out infinite; }
  @keyframes slide { 0% { transform:translateX(-105%); } 100% { transform:translateX(268%); } }
  .status { font-size:12.5px; color:var(--muted); min-height:19px; }
  .retry { display:none; margin:12px auto 0; padding:10px 18px; border:1.5px solid var(--accent);
    border-radius:999px; background:#fff; color:var(--accent-dark); font:inherit;
    font-size:13px; font-weight:700; cursor:pointer; }
  .retry.show { display:inline-block; }
  .retry:hover { background:#e6f2ec; }
  .foot { margin-top:22px; padding-top:14px; border-top:1px solid #eef3f0; }
  .motto { font-size:11.5px; font-weight:800; color:var(--accent-dark); letter-spacing:.03em; }
  .by { margin-top:4px; font-size:11px; color:#9aa9a2; }
</style>
</head>
<body>

<div id="boot">
  <div class="splash">
    <img class="logo" alt="Logo SMK Meradong" width="54" height="64"
         src="https://ingsiong-dev.github.io/erph-dashboard/e-rph/logo.png"
         onerror="this.style.display='none'">
    <div class="brand">KEHADIRAN MESYUARAT<small>SMK MERADONG</small></div>
    <div class="meter"><i></i></div>
    <div class="status" id="bootStatus" role="status" aria-live="polite">Menyediakan sistem&hellip;</div>
    <button class="retry" id="bootRetry" onclick="location.reload()">Cuba lagi</button>
    <div class="foot">
      <div class="motto">Empowering Through Technology</div>
      <div class="by">Developed by Koh Ing Siong</div>
    </div>
  </div>
</div>

<iframe id="app" title="Sistem Kehadiran Mesyuarat" src="about:blank"
        allow="clipboard-write; camera; microphone; geolocation"></iframe>

<script>
  /* Live web app URL (version 12 deployment, anonymous access). */
  var EXEC_URL = 'https://script.google.com/macros/s/AKfycbxMrSa4fScEFGyjSXQqUIQZX-FFDhotbjg-8LmLNiGtC_tH2wPAfdb4ZzYU7GJ97lTU0A/exec';

  var frame = document.getElementById('app');
  var boot  = document.getElementById('boot');

  // Optional override for testing:  index.html?exec=<other /exec URL>
  var q = new URLSearchParams(location.search);
  var base = q.get('exec') || EXEC_URL;

  // Forward any extra query parameters through to the web app.
  q.delete('exec');
  var qs = q.toString();

  frame.addEventListener('load', function () { boot.classList.add('done'); });
  frame.src = base + (qs ? (base.indexOf('?') === -1 ? '?' : '&') + qs : '');

  // Reassure a teacher on a slow connection, then offer a way out.
  setTimeout(function () {
    var s = document.getElementById('bootStatus');
    if (s && !boot.classList.contains('done')) {
      s.textContent = 'Sambungan perlahan \u2014 sila tunggu sebentar\u2026';
    }
  }, 6000);
  setTimeout(function () {
    if (!boot.classList.contains('done')) document.getElementById('bootRetry').classList.add('show');
  }, 12000);

  // Safety net: never leave the splash up forever.
  setTimeout(function () { boot.classList.add('done'); }, 20000);
</script>

</body>
</html>
